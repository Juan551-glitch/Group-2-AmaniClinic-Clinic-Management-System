name: AmaniClinic GitHub Actions CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore Packages
        run: dotnet restore AmaniClinic.csproj

      - name: Build Application
        run: dotnet build AmaniClinic.csproj --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test AmaniClinic.csproj --configuration Release --no-build

      - name: Publish Application
        run: dotnet publish AmaniClinic.csproj --configuration Release --no-restore --output ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AmaniClinic'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_AMANICLINIC }}
          package: ./publish
